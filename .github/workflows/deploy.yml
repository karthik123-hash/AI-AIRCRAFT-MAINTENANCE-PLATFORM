name: Deploy AI Aircraft Maintenance Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  deploy:

    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BACKEND_IMAGE: ${{ secrets.BACKEND_IMAGE }}
      FRONTEND_IMAGE: ${{ secrets.FRONTEND_IMAGE }}
      IMAGE_TAG: ${{ github.sha }}
      ECS_CLUSTER: aircraft-maintenance
      BACKEND_SERVICE: aircraft-maintenance-backend
      FRONTEND_SERVICE: aircraft-maintenance-frontend
  
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        id: backend-image
        run: |
          docker build \
            -t $BACKEND_IMAGE:$IMAGE_TAG \
            -t $BACKEND_IMAGE:latest \
            ./backend
          docker push --all-tags $BACKEND_IMAGE
          echo "image=$BACKEND_IMAGE:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Frontend Image
        id: frontend-image
        run: |
          docker build \
            -t $FRONTEND_IMAGE:$IMAGE_TAG \
            -t $FRONTEND_IMAGE:latest \
            ./frontend
          docker push --all-tags $FRONTEND_IMAGE
          echo "image=$FRONTEND_IMAGE:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download Task Definitions
        run: |
          BACKEND_TD=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $BACKEND_SERVICE \
            --query "services[0].taskDefinition" \
            --output text)
          FRONTEND_TD=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $FRONTEND_SERVICE \
            --query "services[0].taskDefinition" \
            --output text)
          aws ecs describe-task-definition \
            --task-definition $BACKEND_TD \
            --query taskDefinition > backend-task-def.json
          aws ecs describe-task-definition \
            --task-definition $FRONTEND_TD \
            --query taskDefinition > frontend-task-def.json
          echo "Backend containers:"
          jq -r '.containerDefinitions[].name' backend-task-def.json
          echo "Frontend containers:"
          jq -r '.containerDefinitions[].name' frontend-task-def.json

      - name: Render Backend Task Definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: ${{ env.BACKEND_CONTAINER }}
          image: ${{ steps.backend-image.outputs.image }}

      - name: Render Frontend Task Definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: ${{ env.FRONTEND_CONTAINER }}
          image: ${{ steps.frontend-image.outputs.image }}

      - name: Deploy Backend to ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: ${{ env.BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy Frontend to ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: ${{ env.FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify Services
        run: |
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $BACKEND_SERVICE $FRONTEND_SERVICE \
            --query "services[].{Service:serviceName,Status:status,Running:runningCount,Desired:desiredCount,TaskDef:taskDefinition}" \
            --output table
